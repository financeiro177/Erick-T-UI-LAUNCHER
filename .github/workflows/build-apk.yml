name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Chave de assinatura fixa (segredo DEBUG_KEYSTORE_BASE64)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$HOME/.android/debug.keystore"
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"
          else
            echo "::warning::Segredo DEBUG_KEYSTORE_BASE64 ausente: APK assinado com chave temporaria (nao instala por cima do anterior)."
          fi
      - name: Build debug APK (flavor fdroid)
        run: chmod +x gradlew && ./gradlew assembleFdroidDebug --no-daemon --stacktrace
      - name: Assinatura do APK gerado
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs -v app/build/outputs/apk/fdroid/debug/*.apk | grep -E "Verified using|SHA-256 digest|Verifies" || true
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging app/build/outputs/apk/fdroid/debug/*.apk 2>/dev/null | grep -E "^package|sdkVersion|targetSdk|testOnly" | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tui-launcher-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
