name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Chave de assinatura fixa (segredo DEBUG_KEYSTORE_BASE64)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/tui-debug.keystore"
            keytool -list -v -keystore "$RUNNER_TEMP/tui-debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"
            echo "TUI_DEBUG_KEYSTORE=$RUNNER_TEMP/tui-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo DEBUG_KEYSTORE_BASE64 ausente: APK assinado com chave temporaria (nao instala por cima do anterior)."
          fi
      - name: Build debug APK (flavor fdroid)
        run: chmod +x gradlew && ./gradlew assembleFdroidDebug --no-daemon --stacktrace
      - name: Assinatura do APK gerado
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/fdroid/debug/*.apk | grep "certificate SHA-256" | tee "$RUNNER_TEMP/apk-cert.txt"
          if [ -n "$TUI_DEBUG_KEYSTORE" ]; then
            WANT=$(keytool -list -v -keystore "$TUI_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | grep "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
            grep -q "$WANT" "$RUNNER_TEMP/apk-cert.txt" || { echo "::error::O APK nao foi assinado com a chave fixa"; exit 1; }
            echo "APK assinado com a chave fixa."
          fi
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging app/build/outputs/apk/fdroid/debug/*.apk 2>/dev/null | grep -E "^package|sdkVersion|targetSdk|testOnly" | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tui-launcher-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
