name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK (flavor fdroid)
        run: chmod +x gradlew && ./gradlew assembleFdroidDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tui-launcher-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
